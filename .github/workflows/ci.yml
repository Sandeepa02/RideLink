# RideLink CI pipeline
# Builds and runs the unit tests for all four Spring Boot microservices.

name: RideLink CI

on:
  # Run the pipeline whenever code is pushed to these branches
  push:
    branches:
      - main
      - develop
  # Also run it for pull requests that target these branches
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and test all services
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code onto the CI machine
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Java 21 (the version configured in the project's pom.xml)
      # and a Maven installation that the services without a Maven Wrapper can use.
      - name: Set up JDK 21 and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Steps 3-6: Build and test each microservice separately.
      # Running them one-by-one makes the logs show exactly which service failed.
      # GitHub Actions automatically fails the job if any step's command fails,
      # so a compilation error or failing unit test in ANY service fails CI.
      #
      # Each step uses the service's Maven Wrapper (mvnw) when it exists in the
      # repository, and falls back to the runner's Maven otherwise.
      # The 'test' phase compiles the code and runs the unit tests.
      # No database credentials are needed: the unit tests do not connect to
      # MongoDB Atlas.

      - name: Build and test account-service
        working-directory: account-service
        run: if [ -x ./mvnw ]; then ./mvnw test; else mvn test; fi

      - name: Build and test driver-service
        working-directory: driver-service
        run: if [ -x ./mvnw ]; then ./mvnw test; else mvn test; fi

      - name: Build and test ride-service
        working-directory: ride-service
        run: if [ -x ./mvnw ]; then ./mvnw test; else mvn test; fi

      - name: Build and test fare-payment-service
        working-directory: fare-payment-service
        run: if [ -x ./mvnw ]; then ./mvnw test; else mvn test; fi
